name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills
        run: python3 scripts/validate.py
      - name: Smoke test skill scripts
        run: python3 scripts/smoke_test.py
      - name: Check release metadata and generated catalog
        run: python3 scripts/release_metadata.py --check && python3 scripts/sync_catalog.py --check && python3 scripts/check_docs.py
      - name: Install pytest
        run: pip install pytest==8.4.2
      - name: Run test suite
        run: python3 -m pytest tests/ -q
