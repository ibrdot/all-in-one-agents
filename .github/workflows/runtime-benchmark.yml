name: Runtime contract benchmark
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest==8.4.2
      - name: Execute offline golden contracts against reviewed baseline
        run: python3 -m runtime.benchmark --baseline evals/golden/baseline.json --output benchmark-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-contract-report
          path: benchmark-report.json
